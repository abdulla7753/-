name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Simulation server (SUMO) tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check roadflow_server tests
      - run: pytest -q

  app:
    name: Tablet app analyze + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK (tablets)
    needs: app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: roadflow-ai-android-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  ios:
    name: iPadOS build (unsigned)
    needs: app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign
      - run: cd build/ios/iphoneos && zip -qr Runner-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: roadflow-ai-ios-unsigned
          path: app/build/ios/iphoneos/Runner-unsigned.zip
          retention-days: 30
